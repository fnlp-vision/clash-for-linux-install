###############################################################################
# 团队统一 Mixin 配置模板
#
# 这套配置做了什么：
#   - Claude / Anthropic 全家 + WebRTC(STUN/TURN) 强制走家宽链式出口，防 IP 泄漏
#   - DNS 全走 DoH 且强制经家宽出口，关 IPv6，防 DNS / v6 泄漏
#   - Airport-Auto(url-test) 自动选裸延迟最低的机场节点，Chain-Auto(url-test)
#     自动选「节点 → 家宽」链式延迟最低的一级节点做链式代理入口，换订阅零改动
#   - inject-all 把链式节点自动注入订阅里所有手动选择组，面板上随时可选
#
# 安装后必做：
#   1. clashmixin -e 打开本文件，填写下面「家宽链式出口」的 server / port /
#      username / password —— 这是每个人自己的凭据，⚠️ 不要提交回仓库
#   2. 保存退出即自动重启生效
#   3. 验证出口 IP：clashon && curl -s https://api64.ipify.org
#
# 换订阅后自查一次 DNS 有没有被订阅自带的 nameserver-policy 污染（订阅的
# "表型" key 在合并时会存活）：
#   clashmixin -r | ~/clashctl/bin/yq '.dns'
###############################################################################

_custom:
  system-proxy:
    enable: true

# ===== 基础 =====
mixed-port: 7890
external-controller: "0.0.0.0:9090"
external-ui: dist
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
secret: "" # 安装时会自动生成随机密钥，用 clashsecret 查看
allow-lan: false
ipv6: false # 全局关 IPv6，防 v6 泄漏

# ===== 规则 =====
# prefix 前置（最高优先级） / suffix 后置 / override 按 name 替换
rules:
  prefix:
    # --- 工具 / 直连 ---
    - DOMAIN,api64.ipify.org,DIRECT # clashui 获取真实公网 IP
    - DOMAIN-SUFFIX,feishu.cn,DIRECT
    - DOMAIN-SUFFIX,larksuite.com,DIRECT
    - DOMAIN-SUFFIX,feishucdn.com,DIRECT
    - DOMAIN-SUFFIX,feishu.net,DIRECT
    - DOMAIN-SUFFIX,larkoffice.com,DIRECT
    - DOMAIN-SUFFIX,larksuitecdn.com,DIRECT
    - DOMAIN-SUFFIX,nexus.sii.shaipower.online,DIRECT # 启智平台
    # --- Claude 全家走家宽 ---
    - "DOMAIN-SUFFIX,anthropic.com,Claude-家宽"
    - "DOMAIN-SUFFIX,claude.ai,Claude-家宽"
    - "DOMAIN-SUFFIX,claude.com,Claude-家宽"
    - "DOMAIN-SUFFIX,clau.de,Claude-家宽"
    - "DOMAIN-SUFFIX,claudemcpclient.com,Claude-家宽"
    - "DOMAIN-SUFFIX,claudemcpcontent.com,Claude-家宽"
    - "DOMAIN-SUFFIX,claudeusercontent.com,Claude-家宽"
    # 补齐订阅 RULE-SET ai 里有、原列表缺失的 Claude 相关域名（否则会落到订阅的 AI 组、不走家宽）
    - "DOMAIN-SUFFIX,claude.app,Claude-家宽"
    - "DOMAIN-SUFFIX,claude.dev,Claude-家宽"
    - "DOMAIN-SUFFIX,claude.site,Claude-家宽"
    - "DOMAIN-SUFFIX,claude.new,Claude-家宽"
    - "DOMAIN-SUFFIX,claudestudio.com,Claude-家宽"
    - "DOMAIN-SUFFIX,claudepages.dev,Claude-家宽"
    - "DOMAIN-SUFFIX,claudeacademy.com,Claude-家宽"
    - "DOMAIN-SUFFIX,chatbotclaude.com,Claude-家宽"
    - "DOMAIN-SUFFIX,anthropic.team,Claude-家宽"
    - "DOMAIN,servd-anthropic-website.b-cdn.net,Claude-家宽"
    - "DOMAIN,anthropic.com.cdn.cloudflare.net,Claude-家宽"
    - "DOMAIN,anthropic.auth0.com,Claude-家宽"
    - "DOMAIN,anthropic-com.ghost.io,Claude-家宽"
    - "DOMAIN-SUFFIX,sentry.io,Claude-家宽"
    - "DOMAIN-SUFFIX,statsigapi.net,Claude-家宽"
    - "DOMAIN,browser-intake-us5-datadoghq.com,Claude-家宽"
    - "DOMAIN-KEYWORD,datadog,Claude-家宽"
    - "DOMAIN-KEYWORD,sift,Claude-家宽"
    - "DOMAIN-SUFFIX,intercom.io,Claude-家宽"
    - "DOMAIN-SUFFIX,intercomcdn.com,Claude-家宽"
    - "DOMAIN,cdn.usefathom.com,Claude-家宽"
    - "IP-CIDR,160.79.104.0/21,Claude-家宽,no-resolve"
    - "IP-CIDR6,2607:6bc0::/32,Claude-家宽,no-resolve"
    - "IP-ASN,399358,Claude-家宽,no-resolve"
    # --- WebRTC / STUN / TURN 防泄漏 ---
    - "DOMAIN-KEYWORD,stun,Claude-家宽"
    - "DOMAIN-KEYWORD,turn,Claude-家宽"
    - "DOMAIN-SUFFIX,relay.metered.ca,Claude-家宽"
    - "DOMAIN-SUFFIX,xirsys.com,Claude-家宽"
  suffix:

# ===== 节点 =====
proxies:
  prefix:
    # --- 家宽链式出口：dialer-proxy 指向「入口」组（默认自动测速，也可面板手动钉死）---
    # ⚠️ 下面 4 行是每人自己的凭据，安装后 clashmixin -e 填写，填完不要提交回仓库。
    #    不填就是连本机 1080，Claude 流量会直接失败（fail closed，不会裸奔出去）。
    - name: "家宽-01-链式代理"
      type: socks5
      server: "127.0.0.1" # ← 替换：家宽服务器地址
      port: 1080 # ← 替换：端口
      username: "REPLACE_ME" # ← 替换：用户名
      password: "REPLACE_ME" # ← 替换：密码
      udp: true
      dialer-proxy: "入口"
  suffix:
  override:

# ===== 策略组 =====
proxy-groups:
  prefix:
    # Airport-Auto：自动按测速选最快的机场节点（url-test，不可手动选）。
    # include-all 自动纳入"当前订阅"全部节点；exclude-filter 必须排除我们自己
    # 注入的节点（家宽 / 链式），否则家宽的 dialer 可能选到自己 → 成环。
    # 「订阅」只精确匹配提示类伪节点（订阅到期 / 更新订阅…），不误伤「订阅 · 香港」这类真实节点。
    # 流量提示只认「数字 + GB」（100GB / 50.2 GB），不误伤「英国 GB 01」；「拉取」对应「拉取于->时间」提示。
    # exclude-type 排除 type: direct/dns/reject 的伪节点（机场常拿 direct 塞提示信息，被当成入口
    # 就等于本机直连家宽、绕过机场）。mixin 自己的节点名合并时会自动追加进 exclude-filter。
    # 倍率节点（5x / [2x] / x3 / 1.5倍 / 高倍 / 倍率）不进自动测速：延迟碰巧最低时会按倍率扣流量；
    # 0.5x、1x、x1 这类不高于 1 倍的保留。Chain-Auto 的候选沿用本组 exclude-filter，一并生效；
    # 「入口」是手动 select 组，不排除倍率节点，仍可在面板手动钉。
    - name: "Airport-Auto"
      type: url-test
      include-all: true
      exclude-filter: "(?i)链式|家宽|Sii|mosi|fnlp|启智|流量|剩余|到期|过期|重置|官网|套餐|拉取|\\d+(?:\\.\\d+)?\\s*GB|Days|expire|distance|订阅(?:地址|链接|到期|过期|重置|信息|官网|有效|提示)|(?:更新|官网|地址|链接)订阅|(?:^|[^\\d.])(?:[2-9]|[1-9]\\d+|1\\.\\d*[1-9])(?:\\.\\d+)?\\s*(?:[xX×]|倍)|(?:^|[^A-Za-z])[xX×]\\s*(?:[2-9]|[1-9]\\d+|1\\.\\d*[1-9])(?:\\.\\d+)?(?:$|[^\\d.])|高倍|倍率"
      exclude-type: "Direct|Dns|Reject"
      url: http://www.gstatic.com/generate_204
      interval: 300
      tolerance: 50
    # 入口：家宽 dialer 实际指向的组（手动模式用）。第一项 Airport-Auto = 默认
    # 走自动测速；include-all 把订阅里每个具体节点也铺进来，可在面板手动钉死。
    # ⚠️ 不要把 Chain-Auto / 链式测速节点放进来：家宽 dialer 选到链式代理会让
    #    家宽服务器回连自己，形成双重封装。
    - name: "入口"
      type: select
      proxies:
        - "Airport-Auto"
      include-all: true
      exclude-filter: "(?i)链式|家宽|Sii|mosi|fnlp|启智|流量|剩余|到期|过期|重置|官网|套餐|拉取|\\d+(?:\\.\\d+)?\\s*GB|Days|expire|distance|订阅(?:地址|链接|到期|过期|重置|信息|官网|有效|提示)|(?:更新|官网|地址|链接)订阅"
      exclude-type: "Direct|Dns|Reject"
    # Claude 专用出口组：合并时会自动将链式测速组置顶为默认项（单家宽时为 Chain-Auto，
    # 多家宽时按出口拆分为「<家宽名>-Auto」并默认启用 lazy: true 避免并发打满家宽）；
    # 想手动钉一级节点时，改选下面的家宽出口，再到「入口」组钉死具体节点。
    - name: "Claude-家宽"
      type: select
      proxies:
        - "家宽-01-链式代理"
  suffix:
  override:
  # inject-all：把链式节点自动塞进订阅自带的所有「手动选择组」(type: select)，
  # 不用硬编码组名 → 换订阅零改动。启用后合并时会自动前置已生成的链式测速组
  # （Chain-Auto / <家宽名>-Auto）。上面 prefix 里自建的组不参与注入，避免成环；
  # 自动测速组（url-test / fallback / load-balance）也不会被注入。
  inject-all:
    - "家宽-01-链式代理"
    - "Airport-Auto"
  # 不想污染广告拦截 / 国内直连这类功能组的话，取消下面注释按组名正则排除：
  # inject-all-exclude: "(?i)拦截广告|广告|国内网站|直连|漏网之鱼"
  # inject：按组名精确注入，与 inject-all 可并存（此处已被 inject-all 覆盖，留作示例）
  # inject:
  #   "🔰 选择节点":
  #     - "家宽-01-链式代理"

# ===== Tun =====
tun:
  enable: false
  stack: system
  auto-route: true
  auto-redir: true # clash
  auto-redirect: false # mihomo
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53
  strict-route: true
  route-exclude-address:
    - 1.1.1.1/32 # 用于 clashui 获取真实内网 IP
    - 127.0.0.1/32
  exclude-interface:
    - docker0 # 避免无法访问容器内服务
    - podman0

# ===== DNS 防泄漏 =====
dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "time.*.com"
    - "ntp.*.com"
    - "+.msftncsi.com"
    - "+.msftconnecttest.com"
    - "localhost.ptlogin2.qq.com"
  # 引导：解析上游 DoH 域名用的纯 IP DNS
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 默认：所有海外 / 非 cn 查询都走家宽出口（#Claude-家宽 强制经该组）
  nameserver:
    - "https://1.1.1.1/dns-query#Claude-家宽"
    - "https://8.8.8.8/dns-query#Claude-家宽"
  # 解析代理服务器自身域名用（避免 fake-ip 循环依赖）
  proxy-server-nameserver:
    - "https://dns.alidns.com/dns-query"
    - "https://doh.pub/dns-query"
  nameserver-policy:
    # 国内 / 私有：国内 DoH 直连，不绕路
    "geosite:cn,private":
      - "https://dns.alidns.com/dns-query"
      - "https://doh.pub/dns-query"
    # Claude 各域名的 DoH 也强制走家宽（兜底）
    "+.anthropic.com":
      - "https://1.1.1.1/dns-query#Claude-家宽"
      - "https://8.8.8.8/dns-query#Claude-家宽"
    "+.claude.ai":
      - "https://1.1.1.1/dns-query#Claude-家宽"
      - "https://8.8.8.8/dns-query#Claude-家宽"
    "+.claude.com":
      - "https://1.1.1.1/dns-query#Claude-家宽"
      - "https://8.8.8.8/dns-query#Claude-家宽"
    "+.clau.de":
      - "https://1.1.1.1/dns-query#Claude-家宽"
      - "https://8.8.8.8/dns-query#Claude-家宽"
    "+.claudemcpclient.com":
      - "https://1.1.1.1/dns-query#Claude-家宽"
      - "https://8.8.8.8/dns-query#Claude-家宽"
    "+.claudemcpcontent.com":
      - "https://1.1.1.1/dns-query#Claude-家宽"
      - "https://8.8.8.8/dns-query#Claude-家宽"
    "+.claudeusercontent.com":
      - "https://1.1.1.1/dns-query#Claude-家宽"
      - "https://8.8.8.8/dns-query#Claude-家宽"
    "+.claude.app":
      - "https://1.1.1.1/dns-query#Claude-家宽"
      - "https://8.8.8.8/dns-query#Claude-家宽"
    "+.claude.dev":
      - "https://1.1.1.1/dns-query#Claude-家宽"
      - "https://8.8.8.8/dns-query#Claude-家宽"
    "+.claude.site":
      - "https://1.1.1.1/dns-query#Claude-家宽"
      - "https://8.8.8.8/dns-query#Claude-家宽"
    "+.claude.new":
      - "https://1.1.1.1/dns-query#Claude-家宽"
      - "https://8.8.8.8/dns-query#Claude-家宽"
    "+.claudestudio.com":
      - "https://1.1.1.1/dns-query#Claude-家宽"
      - "https://8.8.8.8/dns-query#Claude-家宽"
    "+.claudepages.dev":
      - "https://1.1.1.1/dns-query#Claude-家宽"
      - "https://8.8.8.8/dns-query#Claude-家宽"
    "+.claudeacademy.com":
      - "https://1.1.1.1/dns-query#Claude-家宽"
      - "https://8.8.8.8/dns-query#Claude-家宽"
    "+.chatbotclaude.com":
      - "https://1.1.1.1/dns-query#Claude-家宽"
      - "https://8.8.8.8/dns-query#Claude-家宽"
    "+.anthropic.team":
      - "https://1.1.1.1/dns-query#Claude-家宽"
      - "https://8.8.8.8/dns-query#Claude-家宽"
  respect-rules: true
